name: Copilot Setup Steps

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Use a supported Copilot model
        run: echo "COPILOT_MODEL=claude-sonnet-5" >> "$GITHUB_ENV"
